name: Test
on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
      - develop
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: ./.node-version
          cache: "pnpm"
      - run: pnpm install
      # Build velite + vite (TanStack Start prerender) BEFORE tsc.
      # vite build generates app/routeTree.gen.ts which app/router.tsx
      # imports; without this step tsc fails with TS2307.
      - name: Build content layer + tanstack start prerender
        # No network during the build. Every link card has to resolve from
        # data/ogp-cache.json or data/ogp-unfetchable.json, both committed, so
        # CI cannot produce different HTML depending on whether some third
        # party site answered. Adding a link to a post therefore fails here
        # until the cache entry the author's local build wrote is committed.
        env:
          OGP_OFFLINE: strict
        run: pnpm build
      - run: pnpm test:types
      - run: pnpm test
      # Phase 2 smoke: prerender must emit home + profile + every velite
      # post (>= 111). Spot-check OGP meta on a known post — both an
      # original-slug post (php-replace-lf) and a renamed-slug post
      # (readme-siri, formerly 2017-08-04-listening-book).
      - name: Verify dist artifacts (phase 2 routes + OGP)
        run: |
          test -f dist/client/index.html
          test -f dist/client/profile/index.html
          test -f dist/client/php-replace-lf/index.html
          test -f dist/client/readme-siri/index.html
          count=$(find dist/client -name index.html | wc -l)
          test "$count" -ge 111 || { echo "expected >=111 index.html, got $count" && exit 1; }
          grep -a -F -q 'og:image' dist/client/php-replace-lf/index.html
          grep -a -F -q 'og:type' dist/client/php-replace-lf/index.html
          grep -a -F -q 'rel="canonical"' dist/client/php-replace-lf/index.html
          # Phase 3: ensure styled-components runtime DOM is gone.
          # The `data-styled` attribute is styled-components v6's marker;
          # if we still see it, some component slipped through the css modules
          # migration and is rehydrating styles client-side.
          if grep -rF 'data-styled' dist/client/ ; then
            echo "FAIL: found styled-components runtime DOM in prerendered HTML"
            exit 1
          fi
          # Hashed css asset must be linked from the home page.
          grep -E '<link[^>]*rel="stylesheet"[^>]*assets/[^"]+\.css' dist/client/index.html
          # Cloudflare Pages falls back to single-page-application behaviour
          # when 404.html is absent, answering any missing path — including a
          # missing /assets/* file — with index.html and a 200. Combined with
          # the immutable Cache-Control in public/_headers, that pinned a
          # broken stylesheet in the edge cache for a year once.
          test -f dist/client/404.html || {
            echo "FAIL: dist/client/404.html missing — Pages would fall back to serving index.html for missing assets"
            exit 1
          }
          grep -a -F -q '404' dist/client/404.html
      # Content must stay out of the module graph entirely. lib/posts.ts
      # fetches the per-post and per-page JSON by URL; the moment it is
      # imported instead — statically, or through import.meta.glob, which
      # inlines the names and content hashes of every emitted chunk — the
      # entry chunk holding React and TanStack changes hash whenever any post
      # changes, and every returning visitor re-downloads ~90KB gzip.
      - name: Verify the entry chunk carries no content
        run: |
          test -f dist/client/content/pages/1.json
          test -f dist/client/content/posts/php-replace-lf.json
          if node -e 'process.exit(require("./.velite/posts.json").some(p => "body" in p) ? 1 : 0)'; then
            echo "OK: posts.json carries metadata only"
          else
            echo "FAIL: posts.json still embeds article bodies" && exit 1
          fi
          entry=$(find dist/client/assets -name 'index-*.js' -print -quit)
          test -n "$entry" || { echo "FAIL: no entry chunk emitted" && exit 1; }
          if grep -q 'php-replace-lf' "$entry"; then
            echo "FAIL: $entry names a post — content is back in the bundle" && exit 1
          fi
          if find dist/client/assets -name 'posts-*.js' | grep -q .; then
            echo "FAIL: a shared posts chunk is back" && exit 1
          fi
          size=$(stat -c%s "$entry")
          echo "entry chunk: ${size}B"
          test "$size" -lt 320000 || {
            echo "FAIL: entry chunk is ${size}B (>320KB)"
            exit 1
          }
