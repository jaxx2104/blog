name: Lint
on:
  push:
    branches:
      - main
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
      - develop
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: ./.node-version
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm lint:ci
      # Japanese prose in content/. This was not wired up before, so 161
      # violations accumulated unnoticed across 13 posts.
      - run: pnpm lint:text
